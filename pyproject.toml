[project]
name = "pykoclaw-chat"
version = "0.1.0"
description = "Chat plugin for pykoclaw"
requires-python = ">=3.12"
dependencies = ["pykoclaw", "click", "claude-agent-sdk"]

[tool.uv.sources]
pykoclaw = { workspace = true }

[project.entry-points."pykoclaw.plugins"]
chat = "pykoclaw_chat:ChatPlugin"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
